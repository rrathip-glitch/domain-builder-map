<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domain builder map</title>
<link rel="stylesheet" href="/style.css?v=12">
<link rel="stylesheet" href="/usmap.css?v=12">
<link rel="stylesheet" href="/orgmap.css?v=12">
</head>
<body>
<header class="top">
  <a class="brand" href="#/home"><span class="mark">D</span><span class="bt">Domain <small>builder map</small></span></a>
  <nav id="nav">
    <a href="#/home" data-tab="home">Home</a>
    <a href="#/builders" data-tab="builders">Builders</a>
    <a href="#/states" data-tab="states">By state</a>
    <a href="#/people" data-tab="people">People</a>
    <a href="#/feed" data-tab="feed">News</a>
    <a href="#/competitors" data-tab="competitors">Competitors</a>
    <a href="#/ma" data-tab="ma">Deals</a>
    <a href="#/insights" data-tab="insights">Insights</a>
  </nav>
  <div class="search" id="topsearch">
    <input id="q" type="search" placeholder="Search   /" title="Search builders, people and competitors (press /)" autocomplete="off" aria-label="Search builders and people">
    <div id="qres" class="qres" hidden></div>
  </div>
</header>
<div class="legend" id="legend">
  <span class="lg-label">How sure is each fact</span>
  <span class="cf Verified" title="Primary source opened: SEC filing, company site or release, government record"><i></i>Verified <em>primary source</em></span>
  <span class="cf Reported" title="Secondary source opened: trade press, news, published rankings, directories"><i></i>Reported <em>trade press or news</em></span>
  <span class="cf Inferred" title="Derived, pattern-built or stale. A lead to confirm."><i></i>Inferred <em>a lead to confirm</em></span>
  <span class="lg-right"><span id="built"></span>
    <a href="#/coverage">Coverage</a>
    <button class="linkbtn" id="rebuild" title="Re-run the build: merge the latest research files and rewrite the workbook (about 2 seconds)" hidden>Refresh data</button>
    <a class="dl" id="xlsx" href="/exports/Domain-Builder-Map.xlsx" hidden>Download workbook</a></span>
</div>
<main id="main">
  <section class="hero">
    <div class="skel" style="height:2.6rem;max-width:34rem"></div>
    <div class="skel-row"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    <p class="muted">Loading the map…</p>
  </section>
</main>
<script type="module" src="/app.js?v=12"></script>
</body>
</html>
